{% extends "admin-panel/base.html" %}

{% block content %}

<style>

.detail-box{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.detail-box h3{
    margin-bottom:10px;
}

.detail-box p{
    color:#555;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    background:#1E4DB7;
    color:white;
    padding:10px 20px;
    border-radius:25px;
    text-decoration:none;
}

</style>

<h2>Détail de la demande</h2>

<div class="detail-box">

<h3>{{ partner.organization }}</h3>

<p><strong>Email :</strong> {{ partner.email }}</p>
<p><strong>Date :</strong> {{ partner.created_at|date:"d M Y H:i" }}</p>

<hr>

<p>{{ partner.message }}</p>

<a href="{% url 'admin_partners' %}" class="back-btn">← Retour</a>

</div>

{% endblock %}
