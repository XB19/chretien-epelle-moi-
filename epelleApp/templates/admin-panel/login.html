<!DOCTYPE html>
<html>

<head>

<title>Connexion Admin</title>

<style>

body{
font-family:Arial;
background:#f4f6fb;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.login-box{
background:white;
padding:40px;
width:350px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.login-box h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#1E4DB7;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#163c8f;
}

</style>

</head>


<body>

<div class="login-box">

<h2>Connexion Admin</h2>

<form method="POST">

{% csrf_token %}

<input type="text" name="username" placeholder="Nom d'utilisateur">

<input type="password" name="password" placeholder="Mot de passe">

<button type="submit">Se connecter</button>

</form>

</div>

</body>

</html>
